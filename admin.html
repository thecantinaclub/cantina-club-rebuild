
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cantina Club — Admin Review</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #0c1018;
      color: #f0f2f6;
      font: 16px/1.5 Arial, sans-serif;
    }
    main { max-width: 1000px; margin: auto; }
    h1, h2 { color: #e4c16f; }
    .panel, .submission {
      margin: 18px 0;
      padding: 20px;
      border: 1px solid #424c60;
      border-radius: 10px;
      background: #141923;
    }
    label { display: block; margin: 12px 0 5px; font-weight: bold; }
    input, textarea {
      display: block;
      width: 100%;
      padding: 10px;
      border: 1px solid #424c60;
      border-radius: 6px;
      background: #0c1018;
      color: #f0f2f6;
      font: inherit;
    }
    textarea { min-height: 70px; resize: vertical; }
    button {
      margin: 12px 8px 0 0;
      padding: 10px 15px;
      border: 0;
      border-radius: 6px;
      background: #e4c16f;
      color: #141923;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary {
      border: 1px solid #424c60;
      background: #252b38;
      color: #f0f2f6;
    }
    button.reject { background: #6f3038; color: white; }
    button:disabled { opacity: .5; cursor: wait; }
    .hidden { display: none !important; }
    .muted { color: #a8b0c0; }
    .status { margin-top: 12px; overflow-wrap: anywhere; }
    .photos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin: 16px 0;
    }
    .photos img {
      display: block;
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      background: #080a0e;
      border: 1px solid #424c60;
      border-radius: 6px;
    }
    .photo-label { margin-bottom: 6px; color: #e4c16f; }
    .submission-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .actions { margin-top: 18px; }
    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 32px;
      border-bottom: 1px solid #424c60;
    }
    .count {
      display: inline-block;
      padding: 3px 10px;
      border: 1px solid #424c60;
      border-radius: 20px;
      color: #f0f2f6;
      font-size: 14px;
    }
    .empty {
      padding: 14px 0;
      color: #a8b0c0;
    }
  </style>
</head>
<body>
<main>
  <h1>Cantina Club Admin</h1>
  <p class="muted">
    Private submission review. Only approved card information and
    deliberately published photos appear in the public archive.
    Pending submission photos remain private.
  </p>

  <section id="login-panel" class="panel">
    <h2>Admin login</h2>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password"
        autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <p id="login-status" class="status" role="status"></p>
  </section>

  <section id="admin-panel" class="hidden">
    <div class="panel">
      <span id="signed-in" class="muted"></span>
      <button id="refresh-button" type="button">Refresh submissions</button>
      <button id="logout-button" type="button" class="secondary">
        Sign out
      </button>
      <p id="list-status" class="status" role="status"></p>
    </div>

    <section aria-labelledby="pending-heading">
      <div class="section-heading">
        <h2 id="pending-heading">Pending submissions</h2>
        <span id="pending-count" class="count">0</span>
      </div>
      <div id="pending-submissions"></div>
    </section>

    <section aria-labelledby="approved-heading">
      <div class="section-heading">
        <h2 id="approved-heading">Approved submissions</h2>
        <span id="approved-count" class="count">0</span>
      </div>
      <div id="approved-submissions"></div>
    </section>

    <section aria-labelledby="rejected-heading">
      <div class="section-heading">
        <h2 id="rejected-heading">Rejected submissions</h2>
        <span id="rejected-count" class="count">0</span>
      </div>
      <div id="rejected-submissions"></div>
    </section>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(() => {
  const loginPanel = document.getElementById("login-panel");
  const adminPanel = document.getElementById("admin-panel");
  const loginForm = document.getElementById("login-form");
  const loginStatus = document.getElementById("login-status");
  const listStatus = document.getElementById("list-status");

  const sections = {
    pending: {
      container: document.getElementById("pending-submissions"),
      count: document.getElementById("pending-count")
    },
    approved: {
      container: document.getElementById("approved-submissions"),
      count: document.getElementById("approved-count")
    },
    rejected: {
      container: document.getElementById("rejected-submissions"),
      count: document.getElementById("rejected-count")
    }
  };

  if (!window.supabase ||
      !window.CANTINA_SUPABASE_URL ||
      !window.CANTINA_SUPABASE_KEY) {
    loginStatus.textContent =
      "Configuration missing. Check supabase-config.js.";
    return;
  }

  const client = window.supabase.createClient(
    window.CANTINA_SUPABASE_URL,
    window.CANTINA_SUPABASE_KEY
  );

  function makeElement(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  function clearSubmissions() {
    Object.values(sections).forEach(section => {
      section.container.replaceChildren();
      section.count.textContent = "0";
    });
  }

  function showSignedOut(message = "") {
    loginPanel.classList.remove("hidden");
    adminPanel.classList.add("hidden");
    clearSubmissions();
    loginStatus.textContent = message;
  }

  function showSignedIn(user) {
    loginPanel.classList.add("hidden");
    adminPanel.classList.remove("hidden");
    document.getElementById("signed-in").textContent =
      "Signed in as " + (user.email || "admin");
  }

  function formatDate(value) {
    if (!value) return "Unknown date";
    const date = new Date(value);
    return Number.isNaN(date.getTime())
      ? value
      : date.toLocaleString();
  }

  function addField(form, key, value) {
    const label = makeElement("label", "", key);
    const isLong = String(value ?? "").length > 100 ||
      /notes|information|details/i.test(key);
    const input = makeElement(isLong ? "textarea" : "input");

    input.name = key;
    input.value = value == null ? "" : String(value);
    input.dataset.fieldKey = key;

    form.appendChild(label);
    form.appendChild(input);
  }

  async function getPhotoUrl(path) {
    if (!path) return null;

    const { data, error } = await client.storage
      .from("card-submissions")
      .createSignedUrl(path, 3600);

    if (error) {
      console.error("Could not open private photo:", error);
      return null;
    }

    return data.signedUrl;
  }

  async function addPhoto(container, label, path) {
    const column = makeElement("div");
    column.appendChild(makeElement("div", "photo-label", label));

    const url = await getPhotoUrl(path);

    if (url) {
      const img = makeElement("img");
      img.src = url;
      img.alt = label;
      img.loading = "lazy";
      column.appendChild(img);

      const link = makeElement("a", "", "Open full-size photo");
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      column.appendChild(link);
    } else {
      column.appendChild(makeElement("p", "muted",
        "Photo unavailable or permission denied."));
    }

    container.appendChild(column);
  }

  function getExtension(path, mimeType) {
    const match = String(path || "").match(/\.(jpg|jpeg|png|webp)$/i);
    if (match) return match[1].toLowerCase();

    if (mimeType === "image/png") return "png";
    if (mimeType === "image/webp") return "webp";
    return "jpg";
  }

  function getMimeType(extension, blobType) {
    if (blobType && [
      "image/jpeg",
      "image/png",
      "image/webp"
    ].includes(blobType)) {
      return blobType;
    }

    if (extension === "png") return "image/png";
    if (extension === "webp") return "image/webp";
    return "image/jpeg";
  }

  function safePathPart(value) {
    return String(value || "")
      .trim()
      .replace(/[^a-zA-Z0-9_-]/g, "-");
  }

  async function copyApprovedPhoto(sourcePath, destinationPath) {
    if (!sourcePath) return null;

    const { data: file, error: downloadError } = await client.storage
      .from("card-submissions")
      .download(sourcePath);

    if (downloadError) {
      throw new Error("Could not read the private photo: " +
        downloadError.message);
    }

    const extension = getExtension(sourcePath, file.type);
    const contentType = getMimeType(extension, file.type);

    if (file.size > 10 * 1024 * 1024) {
      throw new Error("A photo exceeds the 10 MB public bucket limit.");
    }

    if (!["image/jpeg", "image/png", "image/webp"].includes(contentType)) {
      throw new Error("Unsupported photo format.");
    }

    const { error: uploadError } = await client.storage
      .from("approved-card-images")
      .upload(destinationPath, file, {
        contentType,
        upsert: true,
        cacheControl: "3600"
      });

    if (uploadError) {
      throw new Error("Could not publish photo: " + uploadError.message);
    }

    return destinationPath;
  }

  async function publishApprovedPhotos(item, cardNumber) {
    if (!item.front_image_path && !item.back_image_path) {
      throw new Error("This submission has no saved front or back photo.");
    }

    const setSlug = safePathPart(item.set_slug);
    const safeNumber = safePathPart(cardNumber);

    if (!setSlug || !safeNumber) {
      throw new Error("The set name or card number is missing.");
    }

    const basePath = setSlug + "/card-" + safeNumber + "/" + item.id;

    let frontPath = null;
    let backPath = null;

    if (item.front_image_path) {
      const ext = getExtension(item.front_image_path);
      frontPath = await copyApprovedPhoto(
        item.front_image_path,
        basePath + "-front." + ext
      );
    }

    if (item.back_image_path) {
      const ext = getExtension(item.back_image_path);
      backPath = await copyApprovedPhoto(
        item.back_image_path,
        basePath + "-back." + ext
      );
    }

    const update = {};
    if (frontPath) update.front_image_path = frontPath;
    if (backPath) update.back_image_path = backPath;

    const { error: updateError } = await client
      .from("approved_cards")
      .update(update)
      .eq("set_slug", item.set_slug)
      .eq("card_number", String(cardNumber).trim());

    if (updateError) {
      throw new Error(
        "Photos were uploaded, but the approved record could not be updated: " +
        updateError.message
      );
    }
  }

  async function makeSubmissionCard(item) {
    const card = makeElement("article", "submission");
    const header = makeElement("div", "submission-header");

    header.appendChild(makeElement("h3", "",
      "Card #" + item.card_number));
    header.appendChild(makeElement("span", "muted",
      item.status + " · " + formatDate(item.created_at)));
    card.appendChild(header);

    card.appendChild(makeElement("p", "muted",
      "Set: " + item.set_slug));

    const photos = makeElement("div", "photos");
    card.appendChild(photos);
    await addPhoto(photos, "Front photo", item.front_image_path);
    await addPhoto(photos, "Back photo", item.back_image_path);

    const form = makeElement("form");
    const data = item.submitted_data &&
      typeof item.submitted_data === "object" &&
      !Array.isArray(item.submitted_data)
      ? item.submitted_data
      : {};

    const numberLabel = makeElement("label", "", "Card number");
    const numberInput = makeElement("input");
    numberInput.name = "card_number";
    numberInput.value = item.card_number || "";
    numberInput.required = true;
    form.appendChild(numberLabel);
    form.appendChild(numberInput);

    form.appendChild(makeElement("h3", "", "Submitted card information"));
    Object.keys(data).forEach(key => addField(form, key, data[key]));

    const notesLabel = makeElement("label", "", "Admin notes");
    const notesInput = makeElement("textarea");
    notesInput.name = "admin_notes";
    notesInput.value = item.admin_notes || "";
    form.appendChild(notesLabel);
    form.appendChild(notesInput);

    const actions = makeElement("div", "actions");

    const saveButton = makeElement("button", "", "Save corrections");
    saveButton.type = "submit";
    actions.appendChild(saveButton);

    const isPending = item.status === "pending";

    const approveButton = makeElement("button", "", "Approve");
    approveButton.type = "button";
    approveButton.disabled = !isPending;
    actions.appendChild(approveButton);

    const rejectButton = makeElement("button", "reject", "Reject");
    rejectButton.type = "button";
    rejectButton.disabled = !isPending;
    actions.appendChild(rejectButton);

    const publishButton = makeElement(
      "button", "secondary", "Publish approved photos"
    );
    publishButton.type = "button";
    publishButton.disabled = isPending ||
      (!item.front_image_path && !item.back_image_path);
    actions.appendChild(publishButton);

    const message = makeElement("p", "status");
    message.setAttribute("role", "status");
    form.appendChild(actions);
    form.appendChild(message);
    card.appendChild(form);

    let saving = false;

    function getEditedData() {
      const updatedData = {};
      form.querySelectorAll("[data-field-key]").forEach(input => {
        updatedData[input.dataset.fieldKey] = input.value;
      });
      return updatedData;
    }

    function setButtonsDisabled(disabled) {
      saveButton.disabled = disabled;
      approveButton.disabled = disabled || !isPending;
      rejectButton.disabled = disabled || !isPending;
      publishButton.disabled = disabled || isPending ||
        (!item.front_image_path && !item.back_image_path);
    }

    async function saveCorrections() {
      const { error } = await client
        .from("card_submissions")
        .update({
          card_number: numberInput.value.trim(),
          submitted_data: getEditedData(),
          admin_notes: notesInput.value.trim()
        })
        .eq("id", item.id)
        .eq("status", "pending");

      if (error) throw error;
    }

    async function approveSubmission() {
      const { data: existingCards, error: listError } = await client
        .from("approved_cards")
        .select("card_number")
        .eq(
          "set_slug",
          "2004-topps-star-wars-heritage-brandon-mckinney-sketches"
        );

      if (listError) throw listError;

      const usedNumbers = (existingCards || [])
        .map(card => Number(card.card_number))
        .filter(number => Number.isInteger(number) && number > 0);

      const number = String(
        usedNumbers.length ? Math.max(...usedNumbers) + 1 : 1
      );

      numberInput.value = number;

      const { error } = await client.rpc("approve_card_submission", {
        p_submission_id: item.id,
        p_card_number: number,
        p_card_data: getEditedData(),
        p_admin_notes: notesInput.value.trim()
      });

      if (error) throw error;

      if (item.front_image_path || item.back_image_path) {
        try {
          await publishApprovedPhotos(item, number);
        } catch (photoError) {
          throw new Error(
            "The card was approved, but its photos could not be published. " +
            "Refresh submissions and use Publish approved photos to retry. " +
            photoError.message
          );
        }
      }
    }

    async function rejectSubmission() {
      const { error } = await client
        .from("card_submissions")
        .update({
          status: "rejected",
          card_number: numberInput.value.trim(),
          submitted_data: getEditedData(),
          admin_notes: notesInput.value.trim(),
          reviewed_at: new Date().toISOString()
        })
        .eq("id", item.id)
        .eq("status", "pending");

      if (error) throw error;
    }

    async function runAction(action, successMessage) {
      if (saving) return;
      saving = true;
      setButtonsDisabled(true);
      message.textContent = "Saving…";

      try {
        await action();
        message.textContent = successMessage;
        await loadSubmissions();
      } catch (error) {
        console.error("Admin action failed:", error);
        message.textContent =
          "Action failed: " +
          (error.message || "Check permissions and try again.");
        saving = false;
        setButtonsDisabled(false);
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      runAction(saveCorrections, "Corrections saved.");
    });

    approveButton.addEventListener("click", () => {
      if (!confirm(
        "Approve this submission and publish its photos to the public " +
        "archive? Only approved photos will be copied to the public bucket."
      )) return;

      runAction(
        approveSubmission,
        "Approved successfully. Approved photos have been published."
      );
    });

    publishButton.addEventListener("click", () => {
      if (!confirm(
        "Publish or republish the photos for this already-approved card?"
      )) return;

      runAction(
        () => publishApprovedPhotos(item, numberInput.value.trim()),
        "Approved photos published successfully."
      );
    });

    rejectButton.addEventListener("click", () => {
      if (!confirm("Reject this submission?")) return;
      runAction(rejectSubmission, "Submission rejected.");
    });

    return card;
  }

  let loading = false;

  async function loadSubmissions() {
    if (loading) return;
    loading = true;
    listStatus.textContent = "Loading submissions…";
    clearSubmissions();

    try {
      const { data, error } = await client
        .from("card_submissions")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) throw error;

      const grouped = {
        pending: [],
        approved: [],
        rejected: []
      };

      for (const item of data || []) {
        const status = String(item.status || "").toLowerCase();
        if (grouped[status]) {
          grouped[status].push(item);
        }
      }

      for (const status of ["pending", "approved", "rejected"]) {
        const section = sections[status];
        section.count.textContent = String(grouped[status].length);

        if (grouped[status].length === 0) {
          section.container.appendChild(
            makeElement("p", "empty", "No " + status + " submissions.")
          );
          continue;
        }

        for (const item of grouped[status]) {
          const submissionCard = await makeSubmissionCard(item);
          section.container.appendChild(submissionCard);
        }
      }

      listStatus.textContent =
        (data || []).length + " total submission(s): " +
        grouped.pending.length + " pending, " +
        grouped.approved.length + " approved, " +
        grouped.rejected.length + " rejected.";
    } catch (error) {
      console.error("Could not load submissions:", error);
      listStatus.textContent =
        "Could not load submissions. Check the admin permissions.";
    } finally {
      loading = false;
    }
  }

  loginForm.addEventListener("submit", async event => {
    event.preventDefault();
    loginStatus.textContent = "Signing in…";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await client.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      loginStatus.textContent =
        "Sign-in failed. Check your email and password.";
      return;
    }

    showSignedIn(data.user);
    await loadSubmissions();
  });

  document.getElementById("refresh-button").addEventListener(
    "click", loadSubmissions
  );

  document.getElementById("logout-button").addEventListener(
    "click", async () => {
      await client.auth.signOut();
      showSignedOut("You have signed out.");
    }
  );

  client.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT" || !session) {
      showSignedOut();
    }
  });

  client.auth.getSession().then(async ({ data, error }) => {
    if (error || !data.session) {
      showSignedOut();
      return;
    }

    showSignedIn(data.session.user);
    await loadSubmissions();
  });
})();
</script>
</body>
</html>
